# Workflow reutilizable: despliega y ejecuta el pipeline en UN ambiente.
# Lo llama cd.yml para dev -> test -> prod.
name: Deploy (reutilizable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      seed_db:
        description: "true = Postgres local con datos sintéticos; false = base de la clase (secrets)"
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string
        default: ""

jobs:
  deploy:
    name: Desplegar en ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dmc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dmc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      USE_SEED: ${{ inputs.seed_db || vars.USE_SEED_DB == 'true' }}
      # Si USE_SEED es true se usa el Postgres local; si no, la base de la clase.
      PG_HOST: ${{ (inputs.seed_db || vars.USE_SEED_DB == 'true') && 'localhost' || secrets.PG_HOST }}
      PG_PORT: ${{ (inputs.seed_db || vars.USE_SEED_DB == 'true') && '5432' || secrets.PG_PORT }}
      PG_DATABASE: dmc
      PG_USER: ${{ (inputs.seed_db || vars.USE_SEED_DB == 'true') && 'postgres' || secrets.PG_USER }}
      PG_PASSWORD: ${{ (inputs.seed_db || vars.USE_SEED_DB == 'true') && 'postgres' || secrets.PG_PASSWORD }}
      STORAGE_MODE: blob
      # Si existe el secret AZURE_STORAGE_CONNECTION_STRING se usa Azure real; si no, Azurite.
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      CSV_BLOB_NAME: ${{ vars.CSV_BLOB_NAME || 'comisiones/ComisionEmpleados_V1_202610.csv' }}
      JOIN_TYPE: ${{ vars.JOIN_TYPE || 'inner' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar paquete
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Cargar datos sintéticos (solo si USE_SEED)
        if: env.USE_SEED == 'true'
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d dmc -v ON_ERROR_STOP=1 -f sql/seed_test_db.sql

      - name: Levantar Azurite (si no hay Azure Storage real)
        if: env.AZURE_STORAGE_CONNECTION_STRING == ''
        run: |
          echo "Sin AZURE_STORAGE_CONNECTION_STRING: usando Azurite como Data Lake"
          npm install -g azurite
          azurite-blob --silent --location /tmp/azurite --blobHost 127.0.0.1 --blobPort 10000 --skipApiVersionCheck --loose --disableTelemetry &
          sleep 5

      - name: Verificar conexión a PostgreSQL
        run: |
          PGPASSWORD="$PG_PASSWORD" PGCONNECT_TIMEOUT=15 psql -h "$PG_HOST" -p "${PG_PORT:-5432}" -U "$PG_USER" -d dmc \
            -c "SELECT count(*) AS empleados FROM rrhh.empleado;"

      - name: Cargar CSV al contenedor raw (landing)
        run: python -m comisiones.upload_csv "data/$(basename "$CSV_BLOB_NAME")" --env "$ENVIRONMENT"

      - name: Ejecutar pipeline
        run: |
          mkdir -p evidencia
          python -m comisiones.pipeline --env "$ENVIRONMENT" --report-file "evidencia/report_${ENVIRONMENT}.json" 2>&1 | tee "evidencia/pipeline_${ENVIRONMENT}.log"
          exit ${PIPESTATUS[0]}

      - name: Smoke test post-despliegue (gate automático)
        run: python -m comisiones.verify_output --env "$ENVIRONMENT" --download-dir evidencia | tee "evidencia/smoke_${ENVIRONMENT}.log"; exit ${PIPESTATUS[0]}

      - name: Resumen en GitHub
        if: always()
        run: |
          python - <<'EOF'
          import json, os, pathlib
          env = os.environ["ENVIRONMENT"]
          p = pathlib.Path(f"evidencia/report_{env}.json")
          lines = [f"## Pipeline comisiones — ambiente `{env}`", ""]
          if p.exists():
              r = json.loads(p.read_text(encoding="utf-8"))
              lines += ["| Métrica | Valor |", "|---|---|"]
              for k in ["periodo", "join_type", "filas_empleado", "filas_csv", "filas_salida",
                        "csv_sin_empleado", "empleados_sin_comision", "total_salario",
                        "total_comision", "total_salario_total", "empleados_exceden_tope",
                        "salida_parquet", "duracion_segundos"]:
                  lines.append(f"| {k} | {r.get(k)} |")
              lines += ["", "**Checks de calidad:** " + ", ".join(
                  f"{k} {'✅' if v else '❌'}" for k, v in r.get("checks", {}).items())]
          else:
              lines.append("❌ No se generó reporte (revisar logs).")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          EOF

      - name: Publicar evidencias (Parquet + reporte + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-${{ inputs.environment }}
          path: evidencia/
